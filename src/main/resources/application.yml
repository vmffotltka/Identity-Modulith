# =============================================================================
# Identity Modulith 애플리케이션 설정
# =============================================================================

spring:
  # ---------------------------------------------------------------------------
  # 애플리케이션 기본 설정
  # ---------------------------------------------------------------------------
  application:
    name: identity-modulith

  # ---------------------------------------------------------------------------
  # 데이터소스 설정 (PostgreSQL)
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://1.224.162.188:51445/nexfron
    username: admin
    password: nexfron11!
    driver-class-name: org.postgresql.Driver

    # =========================================================================
    # HikariCP 커넥션 풀 설정
    # =========================================================================
    hikari:
      # -----------------------------------------------------------------------
      # 풀 크기 설정
      # -----------------------------------------------------------------------
      maximum-pool-size: 20        # 최대 커넥션 수 (개발 환경 기준 20개)
      minimum-idle: 5              # 최소 유휴 커넥션 수

      # -----------------------------------------------------------------------
      # 타임아웃 설정
      # -----------------------------------------------------------------------
      connection-timeout: 30000    # 커넥션 획득 대기 시간 (30초)
      validation-timeout: 5000     # 커넥션 유효성 검증 타임아웃 (5초)
      idle-timeout: 600000         # 유휴 커넥션 유지 시간 (10분)
      max-lifetime: 1800000        # 커넥션 최대 수명 (30분, DB idle timeout보다 짧게)
      keepalive-time: 300000       # keepalive 주기 (5분, 유휴 중 커넥션 유지)

      # -----------------------------------------------------------------------
      # 커넥션 누수 감지
      # -----------------------------------------------------------------------
      leak-detection-threshold: 20000  # 누수 감지 임계값 (20초, 반환 안된 커넥션 경고)

  # ---------------------------------------------------------------------------
  # JPA / Hibernate 설정
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none               # Flyway로 스키마 관리 (Hibernate 자동 생성 비활성화)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # ---------------------------------------------------------------------------
  # Flyway 마이그레이션 설정
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true                    # Flyway 활성화
    baseline-on-migrate: true        # 기존 DB에 Flyway 적용 시
    locations: classpath:db/migration # 마이그레이션 스크립트 위치
    validate-on-migrate: false       # 🔴 체크섬 검증 비활성화
    encoding: UTF-8                  # SQL 파일 인코딩 설정
    detect-encoding: true            # 자동 인코딩 감지 활성화
    clean-disabled: false            # Flyway clean 명령 활성화 (개발 환경)

  # ---------------------------------------------------------------------------
  # Spring Security 기본 인증 설정 (개발 환경용)
  # ---------------------------------------------------------------------------
  security:
    user:
      name: admin                    # Swagger UI 접속 username
      password: admin123             # Swagger UI 접속 password

